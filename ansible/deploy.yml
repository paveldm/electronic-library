---
- name: Deploy electronic library
  hosts: library
  become: true

  vars:
    app_dir: /opt/electronic-library
    data_dir: /var/lib/electronic-library
    app_port: 8000

  tasks:
    - name: Install Python packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - python3-setuptools
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Create application group
      ansible.builtin.group:
        name: library
        system: true

    - name: Create application user
      ansible.builtin.user:
        name: library
        group: library
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create code directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: library
        group: library
        mode: "0700"

    - name: Copy application from Mac to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ app_dir }}/"
        owner: root
        group: root
        mode: "u=rwX,go=rX"
        directory_mode: "0755"
      loop:
        - app.py
        - requirements.txt
        - templates
        - static
      notify: Restart library

    - name: Install application dependencies in virtual environment
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/.venv"
        virtualenv_command: /usr/bin/python3 -m venv
        umask: "0022"
      notify: Restart library

    - name: Install Gunicorn
      ansible.builtin.pip:
        name: gunicorn==23.0.0
        virtualenv: "{{ app_dir }}/.venv"
        virtualenv_command: /usr/bin/python3 -m venv
        umask: "0022"
      notify: Restart library

    - name: Create persistent secret key on first deployment
      ansible.builtin.copy:
        dest: /etc/electronic-library.env
        content: "SECRET_KEY={{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_letters', 'digits']) }}\n"
        owner: root
        group: root
        mode: "0600"
        force: false
      no_log: true
      notify: Restart library

    - name: Install systemd service
      ansible.builtin.template:
        src: library.service.j2
        dest: /etc/systemd/system/electronic-library.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart library

    - name: Enable and start library
      ansible.builtin.systemd_service:
        name: electronic-library
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart library
      ansible.builtin.systemd_service:
        name: electronic-library
        state: restarted
        daemon_reload: true